title = "Flow becomes a solver"
text = "Transport phenomena turned into code: a lattice Boltzmann solver, then entropic, then two-phase, as a bachelor thesis under Prof. Amol Subhedar."

[[chapter]]
scene = "whirl"
period = "Autumn 2024"
title = "Teaching optimisation"
text = "Sole undergraduate teaching assistant for large-scale machine-learning optimisation under Prof. Avishek Ghosh, fifty-plus students."

[[chapter]]
scene = "swatches"
period = "2023 — 2025"
title = "Community"
text = "Design team convener, then Community Manager of the AI Community: InstiGPT, Et.al, seven engineers, and high inference demand."

[[chapter]]
scene = "meadow"
period = "2024"
title = "Fieldwork"
text = "Summers at Zwilling Labs and Lechler, an autumn with QNLP and MIT: digital twins, spray patterns, and a thousand financial filings."

[[chapter]]
scene = "lanterns"
period = "2025 — now"
title = "Lanterns"
text = "Agentic AI infrastructure at Causal Security, a degree in hand in 2026, and the next hard system wherever it is. Anywhere you need me."
