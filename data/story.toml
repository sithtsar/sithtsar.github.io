[[chapter]]
scene = "seed"
period = "2007 — 2022"
title = "Bhilai, where it starts"
text = "Fifteen years at Krishna Public School in Bhilai, a lot of cricket, and a JEE rank that bought a flight to Mumbai."

[[chapter]]
scene = "weave"
period = "2022 — 2026"
title = "IIT Bombay"
text = "Chemical engineering by day, machine learning by night: a B.Tech in the Department of Chemical Engineering and a minor at C-MInDS."

[[chapter]]
scene = "ripples"
period = "2025 — 2026"
title = "Fluids, but in code"
text = "A lattice Boltzmann solver that grew entropic, then two-phase, as my bachelor thesis under Prof. Amol Subhedar. Vortices are prettier when you made them yourself."

[[chapter]]
scene = "whirl"
period = "Autumn 2024"
title = "Teaching, fifty at a time"
text = "The only undergraduate TA for large-scale machine-learning optimisation under Prof. Avishek Ghosh, picked for topping the previous run of the course. Fifty-plus students, one me."

[[chapter]]
scene = "swatches"
period = "2023 — 2025"
title = "The AI Community"
link = "https://ai.tech-iitb.org/"
text = "Community Manager: InstiGPT, Et.al, seven engineers, and more inference demand than GPUs."

[[chapter]]
scene = "meadow"
period = "2024"
title = "Summers away"
text = "Zwilling Labs, then Lechler, then an autumn with QNLP and MIT: digital twins, spray nozzles, and a thousand financial filings."

[[chapter]]
scene = "lanterns"
period = "2025 — now"
title = "Now"
text = "Agentic AI infrastructure at Causal Security, degree in hand, and the next hard system wherever it is."
